<title>買い物チェックリスト</title>
<meta name="description" content="9/21週の夕食献立に必要な買い物リスト。タップしてチェックできます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f1;--surf:#ffffff;--surf2:#f3efe6;--bdr:#e6ddcc;
  --txt:#332f27;--mt:#8b8271;--dim:#c2b9a6;
  --accent:#5c8c5c;--accent-ink:#2f4a2f;--accent-bg:#e7f0e3;
  --danger:#b5654a;
  --sh:0 1px 3px rgba(60,50,30,.08), 0 8px 24px rgba(60,50,30,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a16;--surf:#26241f;--surf2:#2f2c25;--bdr:#3c382f;
    --txt:#eee8db;--mt:#a89e8a;--dim:#5a5546;
    --accent:#8ec98e;--accent-ink:#cdeecb;--accent-bg:#31402f;
    --danger:#e0917a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a16;--surf:#26241f;--surf2:#2f2c25;--bdr:#3c382f;
  --txt:#eee8db;--mt:#a89e8a;--dim:#5a5546;
  --accent:#8ec98e;--accent-ink:#cdeecb;--accent-bg:#31402f;
  --danger:#e0917a;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
  padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;
}
h1,.brand{font-family:'Zen Maru Gothic',sans-serif;}
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
  background:var(--bg);padding:14px 0 10px;
  border-bottom:1px solid var(--bdr);
  display:flex;flex-direction:column;gap:8px;
}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
h1{font-size:1.25rem;font-weight:900;margin:0;color:var(--txt);}
.sub{font-size:.72rem;color:var(--mt);}
.progwrap{display:flex;align-items:center;gap:10px;}
.progtext{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent-ink);}
.progbar{flex:1;height:8px;border-radius:999px;background:var(--surf2);overflow:hidden;}
.progfill{height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease;width:0%;}
.resetbtn{
  font-size:.7rem;color:var(--mt);background:none;border:1px solid var(--bdr);
  border-radius:999px;padding:4px 10px;cursor:pointer;font-family:inherit;
}
.resetbtn:hover{border-color:var(--accent);color:var(--accent-ink);}
main{padding-top:14px;}
.cat{margin-bottom:18px;}
.cathead{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px;
}
.cathead .emoji{font-size:1rem;}
.cathead h2{font-family:'Zen Maru Gothic',sans-serif;font-size:.82rem;font-weight:700;color:var(--mt);letter-spacing:.02em;margin:0;text-transform:uppercase;}
.cathead .count{margin-left:auto;font-size:.68rem;color:var(--dim);font-variant-numeric:tabular-nums;}
ul{list-style:none;margin:0;padding:0;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
li{border-bottom:1px solid var(--bdr);}
li:last-child{border-bottom:none;}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.row:active{background:var(--surf2);}
.box{
  flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;
}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s ease;stroke:#fff;}
.row.done .box{background:var(--accent);border-color:var(--accent);}
.row.done .box svg{opacity:1;transform:scale(1);}
.itext{flex:1;min-width:0;}
.iname{font-size:.92rem;font-weight:500;transition:color .15s;}
.iqty{font-size:.74rem;color:var(--mt);margin-top:1px;}
.row.done .iname{color:var(--dim);text-decoration:line-through;}
.row.done .iqty{color:var(--dim);}
.note{
  margin-top:6px;background:var(--surf2);border:1px dashed var(--bdr);border-radius:12px;
  padding:12px 14px;font-size:.78rem;color:var(--mt);line-height:1.6;
}
.note b{color:var(--txt);}
footer{text-align:center;color:var(--dim);font-size:.68rem;margin-top:20px;padding-bottom:6px;}
</style>

<header>
  <div class="titlerow">
    <h1>🛒 買い物チェックリスト</h1>
    <button class="resetbtn" id="resetBtn">リセット</button>
  </div>
  <div class="sub">9/21(月)〜9/27(日)の夕食献立ぶん・本日購入分</div>
  <div class="progwrap">
    <div class="progbar"><div class="progfill" id="progFill"></div></div>
    <div class="progtext" id="progText">0 / 0</div>
  </div>
</header>

<main id="main"></main>

<div class="note">
  かぼちゃ・大根・玉ねぎ・人参・キャベツは複数レシピで使うため少し多めにしています。<br>
  <b>なすは冷蔵庫の在庫を使用するため購入不要です</b>(火曜のあんかけ+水曜からの作り置きラタトゥイユで消費)。<br>
  その他の在庫(パン・キウイ等)もこのリストに含めていません。
</div>

<footer>タップでチェック。ブラウザに保存され次回開いても状態が残ります。</footer>

<script>
const DATA = [
  {cat:'肉・魚', emoji:'🥩', items:[
    ['鶏むね肉','600g'],['鶏もも肉','300g'],['鶏ひき肉','300g'],
    ['合いびき肉','250〜300gパック(コロッケ+ナポリタンで使い切り)'],
    ['豚ロース薄切り','250g'],['豚こま切れ肉','200g'],['豚バラ(または豚こま)','300g'],
    ['ぶり','2切れ']
  ]},
  {cat:'野菜', emoji:'🥬', items:[
    ['かぼちゃ','中1個(含め煮+二色丼で使用)'],['大根','20cm程度+1/2本'],['玉ねぎ','2〜3個'],
    ['人参','3本'],['キャベツ','2枚程度'],['じゃがいも','4個'],['トマト','3個'],
    ['小松菜','1束'],['きゅうり','1本'],['ズッキーニ','1本(ラタトゥイユ用)'],['パプリカ','1個(ラタトゥイユ用)']
  ]},
  {cat:'卵・乳製品', emoji:'🥚', items:[
    ['卵','4個'],['とろけるチーズ','50g']
  ]},
  {cat:'主食・粉類', emoji:'🍚', items:[
    ['パスタ','100g'],['パン粉','1カップ'],['片栗粉','大さじ1']
  ]},
  {cat:'その他', emoji:'🥫', items:[
    ['トマト缶','2缶'],['クリームコーン缶','1缶'],['油揚げ','2〜3枚']
  ]},
  {cat:'調味料(在庫を確認)', emoji:'🧂', items:[
    ['醤油',''],['みりん',''],['味噌',''],['砂糖',''],['コンソメ','2個'],
    ['鶏がらスープの素',''],['ケチャップ',''],
    ['焼肉のたれ',''],['ごまだれ',''],['にんにく','2片']
  ]}
];

const STORE_KEY = 'shop_20260921_checked';

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }catch(e){ return {}; }
}
function saveState(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
}

function itemKey(cat, name){ return cat + '|' + name; }

function render(){
  const state = loadState();
  const main = document.getElementById('main');
  main.innerHTML = '';
  let total = 0, done = 0;

  DATA.forEach(group=>{
    const catDiv = document.createElement('div');
    catDiv.className = 'cat';
    const groupDone = group.items.filter(([n])=>state[itemKey(group.cat,n)]).length;
    catDiv.innerHTML = `
      <div class="cathead">
        <span class="emoji">${group.emoji}</span>
        <h2>${group.cat}</h2>
        <span class="count">${groupDone}/${group.items.length}</span>
      </div>
      <ul>
        ${group.items.map(([name,qty])=>{
          const key = itemKey(group.cat,name);
          const checked = !!state[key];
          total++; if(checked) done++;
          return `<li><div class="row ${checked?'done':''}" data-key="${key}">
            <div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="itext"><div class="iname">${name}</div>${qty?`<div class="iqty">${qty}</div>`:''}</div>
          </div></li>`;
        }).join('')}
      </ul>
    `;
    main.appendChild(catDiv);
  });

  document.getElementById('progText').textContent = `${done} / ${total}`;
  document.getElementById('progFill').style.width = total ? (done/total*100)+'%' : '0%';

  main.querySelectorAll('.row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const st = loadState();
      const key = row.dataset.key;
      st[key] = !st[key];
      saveState(st);
      render();
    });
  });
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  saveState({});
  render();
});

render();
</script>
